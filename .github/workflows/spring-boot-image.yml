name: Spring Boot Image Build and Deploy
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '25'      
      - run: |
          ./mvnw clean spring-boot:build-image -Pnative  -DskipTests