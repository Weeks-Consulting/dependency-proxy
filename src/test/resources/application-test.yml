spring:
  autoconfigure:
    # Get rid of annoying error on shutdown.
    exclude: org.springframework.boot.devtools.autoconfigure.DevToolsDataSourceAutoConfiguration
  devtools:
    # add-properties: false

server:
  shutdown: immediate

logging:
  file:
    name: spring-boot.log
  logback:
    rollingpolicy:
      max-history: 0
  level:
    # org.springframework: TRACE
    # io.awspring.cloud: TRACE
    # org.springframework.transaction: TRACE
    # org.springframework.jdbc: INFO
    us.weeksconsulting: TRACE
    # us.weeksconsulting.dependency_proxy.service: DEBUG
    us.weeksconsulting.dependency_proxy.dao: DEBUG

application:
  cleanup:
    schedule: 1m
  repositories:
    raw:
      apache:
        base_url: https://dlcdn.apache.org
        cache_ttl: 1m
      npm:
        base_url: https://registry.npmjs.org
        cache_ttl: 1m
      debian:
        base_url: http://deb.debian.org
        cache_ttl: 1m
        excludes:
          - "/*/dists/**"
      rocky:
        base_url: http://dl.rockylinux.org
        cache_ttl: 1m
        excludes:
          - "/pub/rocky/*/*/*/os/repodata/**"

---
spring:
  config:
    activate:
      on-profile: local

application:
  storage:
    type: local
    path: ./storage

---
spring:
  config:
    activate:
      on-profile: s3

application:
  storage:
    type: s3
    bucket: test-bucket
    prefix: dependency-proxy
