spring:
  autoconfigure:
    # Get rid of annoying error on shutdown.
    exclude: org.springframework.boot.devtools.autoconfigure.DevToolsDataSourceAutoConfiguration
  devtools:
    add-properties: false

server:
  shutdown: immediate

logging:
  file:
    name: spring-boot.log
  logback:
    rollingpolicy:
      max-history: 0
  level:
    # org.springframework: TRACE
    # org.springframework.jdbc: TRACE
    # io.awspring.cloud: TRACE
    # software.amazon.awssdk: TRACE
    us.weeksconsulting: DEBUG

application:
  cleanup:
    schedule: 5s
  repositories:
    raw:
      apache:
        base_url: https://dlcdn.apache.org
        cache_ttl: 10s        
      nodejs:
        base_url: https://dist.nodejs.org
        cache_ttl: 30m
      debian:
        base_url: http://deb.debian.org
        cache_ttl: 30m
        excludes:
          - /debian/dists/
          - /debian-security/dists/

---
spring:
  config:
    activate:
      on-profile: local

application:
  storage:
    type: local
    location: ./storage

---
spring:
  config:
    activate:
      on-profile: s3

application:
  storage:
    type: s3
    location: test-bucket
