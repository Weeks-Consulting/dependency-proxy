include:
  - component: $CI_SERVER_FQDN/gitlab-components/docker/docker-service@v29.0.1

variables:
  # CI_DEBUG_SERVICES: true
  # CI_DEBUG_TRACE: true
  # Versions
  POSTGRES_VERSION: 18
  JDK_VERSION: 25
  # Maven Settings
  MAVEN_ARGS: --batch-mode --no-transfer-progress

default:
  image: ${CI_REGISTRY}/common/build-images:alpine-java-jdk-${JDK_VERSION}

test_job:
  stage: test
  extends:
    - .docker-service
  variables:
    SPRING_DATASOURCE_USERNAME: dependency_proxy
    SPRING_DATASOURCE_PASSWORD: dependency_proxy
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:${POSTGRES_VERSION}-alpine
      alias: postgres
      variables:
        POSTGRES_DB: dependency_proxy
        POSTGRES_USER: dependency_proxy
        POSTGRES_PASSWORD: dependency_proxy
  script:
    - ${CI_PROJECT_DIR}/mvnw test

build_job:
  stage: build
  extends:
    - .docker-service
  script:
    - MVN_RELEASE_VERSION="$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout | tr '[:upper:]' '[:lower:]')"
    - SPRING_BOOT_IMAGE_NAME="${CI_REGISTRY_IMAGE}"
    - SPRING_BOOT_IMAGE_TAGS="${SPRING_BOOT_IMAGE_NAME}:${MVN_RELEASE_VERSION}"
    - grype ${CI_PROJECT_DIR} --fail-on HIGH
    - trivy fs ${CI_PROJECT_DIR}
    - ${CI_PROJECT_DIR}/mvnw spring-boot:build-image -DskipTests -Pnative
        -Dspring-boot.build-image.imageName="${SPRING_BOOT_IMAGE_NAME}"
        -Dspring-boot.build-image.tags="${SPRING_BOOT_IMAGE_TAGS}"
    - grype ${CI_REGISTRY_IMAGE} --fail-on HIGH
    - trivy image ${CI_REGISTRY_IMAGE}
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker push ${CI_REGISTRY_IMAGE} --all-tags